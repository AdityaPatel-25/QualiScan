services:
  - type: web
    name: qualiscan-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: demo
      - key: PORT
        value: "8080"
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_OPERATOR_PASSWORD
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://qualiscan.vercel.app,http://localhost:5173
      - key: JAVA_TOOL_OPTIONS
        value: -Xmx300m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m -Xss512k
