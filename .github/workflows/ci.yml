name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ============================================================================
  # 1. Backend: Spring Boot test suite on Java 17
  # ============================================================================
  backend:
    name: Backend Tests (Java 17)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant execute permission for Maven wrapper
        run: chmod +x mvnw

      - name: Run Maven test suite
        run: ./mvnw -B test

  # ============================================================================
  # 2. CV Service: Computer vision inspection tests on Python 3.12
  # ============================================================================
  cv_service:
    name: CV Service Tests (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cv_service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: cv_service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip uninstall -y opencv-python opencv-python-headless || true
          pip install opencv-python-headless pytest

      - name: Run pytest
        run: pytest -q

  # ============================================================================
  # 3. Frontend: React Vitest suite & production build on Node.js 20
  # ============================================================================
  frontend:
    name: Frontend Tests & Build (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest unit tests
        run: npm test -- --run

      - name: Compile production build
        run: npm run build
