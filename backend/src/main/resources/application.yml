server:
  port: ${SERVER_PORT:8080}
spring:
  datasource:
    url: jdbc:h2:file:./data/qualiscan-db;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
qualiscan:
  jwt:
    secret: ${JWT_SECRET:QualiScan-Development-Only-Secret-Change-Me-1234567890}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  upload-dir: ${UPLOAD_DIR:./uploads/snapshots}
---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
