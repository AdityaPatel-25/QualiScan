<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QualiScan WebSocket Dev Test</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --muted: #94a3b8;
            --accent: #3b82f6;
            --success: #22c55e;
            --danger: #ef4444;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 24px;
            line-height: 1.5;
        }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { font-size: 1.5rem; margin-bottom: 8px; }
        p.subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
        .card {
            background-color: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
        input[type="text"], textarea {
            width: 100%;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background-color: #0b1120;
            color: var(--text);
            font-family: monospace;
            font-size: 0.85rem;
        }
        textarea { resize: vertical; min-height: 70px; }
        .button-row { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
        button {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary { background-color: var(--accent); color: white; }
        .btn-danger { background-color: var(--danger); color: white; }
        .btn-secondary { background-color: var(--border); color: var(--text); }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 600;
            background-color: #334155;
            color: var(--muted);
        }
        .status-badge.connected { background-color: rgba(34, 197, 94, 0.2); color: var(--success); }
        .status-badge.disconnected { background-color: rgba(239, 68, 68, 0.2); color: var(--danger); }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background-color: currentColor; }
        .topics-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .topic-tag {
            background-color: #0b1120;
            border: 1px solid var(--border);
            padding: 4px 8px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.8rem;
            color: #38bdf8;
        }
        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        #logArea {
            background-color: #0b1120;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 14px;
            min-height: 300px;
            max-height: 500px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.8rem;
        }
        .log-entry { margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid #1e293b; }
        .log-meta { display: flex; gap: 10px; color: var(--muted); margin-bottom: 4px; }
        .log-topic { color: #f59e0b; font-weight: bold; }
        pre { white-space: pre-wrap; word-break: break-all; color: #e2e8f0; }
    </style>
</head>
<body>
<div class="container">
    <h1>QualiScan WebSocket Dev Test</h1>
    <p class="subtitle">STOMP over WebSocket connection & topic subscription testing</p>

    <div class="card">
        <div class="form-group">
            <label for="urlInput">WebSocket URL</label>
            <input type="text" id="urlInput" value="ws://localhost:8080/ws" />
        </div>
        <div class="form-group">
            <label for="tokenInput">JWT Token (Bearer)</label>
            <textarea id="tokenInput" placeholder="Paste your JWT token here (obtained from /api/auth/login)..."></textarea>
        </div>
        <div class="button-row">
            <button id="btnConnect" class="btn-primary" onclick="connect()">Connect</button>
            <button id="btnDisconnect" class="btn-danger" onclick="disconnect()" disabled>Disconnect</button>
            <span id="statusBadge" class="status-badge disconnected"><span class="status-dot"></span> Disconnected</span>
        </div>
        <div style="margin-top: 16px;">
            <label>Subscribed Topics</label>
            <div class="topics-list">
                <span class="topic-tag">/topic/lines/1/inspections</span>
                <span class="topic-tag">/topic/lines/1/stats</span>
                <span class="topic-tag">/topic/alerts</span>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="log-header">
            <h3>Event Messages Log</h3>
            <button class="btn-secondary" onclick="clearLog()">Clear</button>
        </div>
        <div id="logArea"></div>
    </div>
</div>

<script>
    let stompClient = null;

    window.addEventListener('DOMContentLoaded', () => {
        const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        document.getElementById('urlInput').value = `${proto}//${window.location.host}/ws`;
    });

    function logMessage(topic, payload) {
        const logArea = document.getElementById('logArea');
        const entry = document.createElement('div');
        entry.className = 'log-entry';

        const time = new Date().toLocaleTimeString();
        let formatted;
        try {
            formatted = JSON.stringify(JSON.parse(payload), null, 2);
        } catch (e) {
            formatted = payload;
        }

        entry.innerHTML = `
            <div class="log-meta">
                <span>[${time}]</span>
                <span class="log-topic">${topic}</span>
            </div>
            <pre>${escapeHtml(formatted)}</pre>
        `;
        logArea.appendChild(entry);
        logArea.scrollTop = logArea.scrollHeight;
    }

    function escapeHtml(text) {
        return text.replace(/&/g, "&amp;")
                   .replace(/</g, "&lt;")
                   .replace(/>/g, "&gt;");
    }

    function updateStatus(connected) {
        const badge = document.getElementById('statusBadge');
        const btnConnect = document.getElementById('btnConnect');
        const btnDisconnect = document.getElementById('btnDisconnect');

        if (connected) {
            badge.className = 'status-badge connected';
            badge.innerHTML = '<span class="status-dot"></span> Connected';
            btnConnect.disabled = true;
            btnDisconnect.disabled = false;
        } else {
            badge.className = 'status-badge disconnected';
            badge.innerHTML = '<span class="status-dot"></span> Disconnected';
            btnConnect.disabled = false;
            btnDisconnect.disabled = true;
        }
    }

    function connect() {
        const url = document.getElementById('urlInput').value.trim();
        let token = document.getElementById('tokenInput').value.trim();

        if (!token) {
            alert('Please provide a JWT token');
            return;
        }
        if (token.startsWith('Bearer ')) {
            token = token.substring(7).trim();
        }

        logMessage('SYSTEM', `Connecting to ${url}...`);

        const ws = new WebSocket(url);
        stompClient = Stomp.over(ws);
        stompClient.debug = function(str) {
            // Uncomment to debug raw STOMP frames:
            // console.log(str);
        };

        const headers = {
            'Authorization': 'Bearer ' + token
        };

        stompClient.connect(headers, function(frame) {
            logMessage('SYSTEM', 'STOMP Connected successfully!');
            updateStatus(true);

            // Subscribe to Line 1 inspections
            stompClient.subscribe('/topic/lines/1/inspections', function(msg) {
                logMessage('/topic/lines/1/inspections', msg.body);
            });

            // Subscribe to Line 1 live stats
            stompClient.subscribe('/topic/lines/1/stats', function(msg) {
                logMessage('/topic/lines/1/stats', msg.body);
            });

            // Subscribe to Alerts
            stompClient.subscribe('/topic/alerts', function(msg) {
                logMessage('/topic/alerts', msg.body);
            });

        }, function(error) {
            logMessage('ERROR', 'STOMP Connection error: ' + (error.headers ? error.headers.message : error));
            updateStatus(false);
        });
    }

    function disconnect() {
        if (stompClient !== null) {
            stompClient.disconnect(function() {
                logMessage('SYSTEM', 'Disconnected');
                updateStatus(false);
            });
            stompClient = null;
        }
    }

    function clearLog() {
        document.getElementById('logArea').innerHTML = '';
    }
</script>
</body>
</html>
