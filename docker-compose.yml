services:
  # ============================================================================
  # Database Service (PostgreSQL 16)
  # ============================================================================
  db:
    image: postgres:16-alpine
    container_name: qualiscan-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-qualiscan}
      POSTGRES_USER: ${DB_USER:-qualiscan}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD environment variable is required}
    volumes:
      - qualiscan_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-qualiscan} -d $${POSTGRES_DB:-qualiscan}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "5432:5432"

  # ============================================================================
  # Backend Service (Spring Boot 3.3.x on JRE 17)
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qualiscan-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DATABASE_URL: jdbc:postgresql://db:5432/${DB_NAME:-qualiscan}
      DATABASE_USER: ${DB_USER:-qualiscan}
      DATABASE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD environment variable is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET environment variable is required}
      UPLOAD_DIR: /app/uploads/snapshots
    volumes:
      - qualiscan_uploads:/app/uploads/snapshots
    ports:
      - "8080:8080"

  # ============================================================================
  # Frontend Dashboard (Vite React + Nginx)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    container_name: qualiscan-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

# ==============================================================================
# Persistent Named Volumes
# ==============================================================================
volumes:
  qualiscan_pgdata:
    name: qualiscan_pgdata
  qualiscan_uploads:
    name: qualiscan_uploads
